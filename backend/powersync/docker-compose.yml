name: gi-powersync

# PowerSync (open source, self-hosted) para sincronización offline-first.
#
# El servicio `powersync` replica por WAL lógico contra el Postgres de
# negocio en Railway (`PS_DATA_SOURCE_URI`, ver ../POWERSYNC.md sección 5) —
# no contra un Postgres local. Al ser una conexión externa, no hace falta
# `network_mode: host` para alcanzarla, así que ambos servicios usan la red
# bridge normal de compose. Esto también hace el setup portable a Windows
# (Docker Desktop en Windows/Mac no soporta `network_mode: host` igual que
# Linux nativo, y requiere un toggle experimental de "host networking").
#
# `pg-storage` es un Postgres propio y separado solo para el "bucket
# storage" interno de PowerSync (su libro de sincronización), que nunca
# debe compartirse con el esquema de negocio. `powersync` lo alcanza por su
# nombre de servicio (`pg-storage`) dentro de la red bridge de compose;
# además se publica en localhost:${PG_STORAGE_PORT} por si se necesita
# inspeccionar desde el host.
#
# Uso: ver ../POWERSYNC.md

services:
  powersync:
    image: journeyapps/powersync-service:latest
    restart: unless-stopped
    command: ["start", "-r", "unified"]
    ports:
      - "${PS_PORT:-8080}:${PS_PORT:-8080}"
    depends_on:
      pg-storage:
        condition: service_healthy
    volumes:
      - ./config:/config
    environment:
      POWERSYNC_CONFIG_PATH: /config/service.yaml
      NODE_OPTIONS: --max-old-space-size=500
      PS_PORT: ${PS_PORT:-8080}
      PS_DATA_SOURCE_URI: ${PS_DATA_SOURCE_URI}
      PS_STORAGE_SOURCE_URI: postgresql://${PG_STORAGE_USER:-powersync_storage}:${PG_STORAGE_PASSWORD:?falta PG_STORAGE_PASSWORD en powersync/.env}@pg-storage:5432/${PG_STORAGE_DB:-powersync_storage}
      PS_JWT_SECRET_B64URL: ${PS_JWT_SECRET_B64URL:?falta PS_JWT_SECRET_B64URL en powersync/.env}
      PS_JWT_KID: ${PS_JWT_KID:-gi-backend-hs256-v1}
      # CA autofirmada de Railway para sslmode: verify-ca (ver .env.example
      # y POWERSYNC.md). Vacío/no definida cuando PS_DATA_SOURCE_URI apunta a
      # un Postgres local sin TLS (sslmode: disable en ese caso).
      PS_PG_CACERT: ${PS_PG_CACERT:-}
    healthcheck:
      test:
        - "CMD"
        - "node"
        - "-e"
        - "fetch('http://localhost:${PS_PORT:-8080}/probes/liveness').then(r => r.ok ? process.exit(0) : process.exit(1)).catch(() => process.exit(1))"
      interval: 5s
      timeout: 3s
      retries: 15

  pg-storage:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${PG_STORAGE_USER:-powersync_storage}
      POSTGRES_PASSWORD: ${PG_STORAGE_PASSWORD:?falta PG_STORAGE_PASSWORD en powersync/.env}
      POSTGRES_DB: ${PG_STORAGE_DB:-powersync_storage}
    ports:
      # Publicado en loopback solo para inspección manual desde el host;
      # `powersync` la alcanza por nombre de servicio en la red bridge.
      - "127.0.0.1:${PG_STORAGE_PORT:-5433}:5432"
    volumes:
      - pg_storage_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_STORAGE_USER:-powersync_storage} -d ${PG_STORAGE_DB:-powersync_storage}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pg_storage_data:

name: gi-powersync

# PowerSync (open source, self-hosted) para sincronización offline-first.
#
# No levanta un Postgres nuevo para los datos de negocio: el servicio
# `powersync` se conecta al Postgres local que ya usa el backend
# (`gi_control_combustible`), replicando por WAL lógico. Usa
# `network_mode: host` (en vez de exponer el Postgres del host a la red
# bridge de Docker) para que la conexión salga como 127.0.0.1: así reutiliza
# las reglas de pg_hba.conf que ya confían en localhost, sin tener que editar
# la config de Postgres (que pertenece al usuario de sistema `postgres` y
# requeriría sudo) para permitir la subred del bridge de Docker.
#
# Sí levanta un Postgres propio y separado (`pg-storage`) solo para el
# "bucket storage" interno de PowerSync (su libro de sincronización), que
# nunca debe compartirse con el esquema de negocio. Vive en la red bridge
# normal de compose, publicado en localhost:${PG_STORAGE_PORT} para que
# `powersync` (en la red del host) pueda alcanzarlo.
#
# Uso: ver ../POWERSYNC.md

services:
  powersync:
    image: journeyapps/powersync-service:latest
    restart: unless-stopped
    command: ["start", "-r", "unified"]
    network_mode: host
    depends_on:
      pg-storage:
        condition: service_healthy
    volumes:
      - ./config:/config
    environment:
      POWERSYNC_CONFIG_PATH: /config/service.yaml
      NODE_OPTIONS: --max-old-space-size=500
      PS_PORT: ${PS_PORT:-8080}
      PS_DATA_SOURCE_URI: ${PS_DATA_SOURCE_URI}
      PS_STORAGE_SOURCE_URI: postgresql://${PG_STORAGE_USER:-powersync_storage}:${PG_STORAGE_PASSWORD:?falta PG_STORAGE_PASSWORD en powersync/.env}@127.0.0.1:${PG_STORAGE_PORT:-5433}/${PG_STORAGE_DB:-powersync_storage}
      PS_JWT_SECRET_B64URL: ${PS_JWT_SECRET_B64URL:?falta PS_JWT_SECRET_B64URL en powersync/.env}
      PS_JWT_KID: ${PS_JWT_KID:-gi-backend-hs256-v1}
      # CA autofirmada de Railway para sslmode: verify-ca (ver .env.example
      # y POWERSYNC.md). Vacío/no definida cuando PS_DATA_SOURCE_URI apunta a
      # un Postgres local sin TLS (sslmode: disable en ese caso).
      PS_PG_CACERT: ${PS_PG_CACERT:-}
    healthcheck:
      test:
        - "CMD"
        - "node"
        - "-e"
        - "fetch('http://localhost:${PS_PORT:-8080}/probes/liveness').then(r => r.ok ? process.exit(0) : process.exit(1)).catch(() => process.exit(1))"
      interval: 5s
      timeout: 3s
      retries: 15

  pg-storage:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${PG_STORAGE_USER:-powersync_storage}
      POSTGRES_PASSWORD: ${PG_STORAGE_PASSWORD:?falta PG_STORAGE_PASSWORD en powersync/.env}
      POSTGRES_DB: ${PG_STORAGE_DB:-powersync_storage}
    ports:
      # Solo en loopback: powersync (network_mode: host) lo alcanza como
      # 127.0.0.1:PG_STORAGE_PORT. No es la base de negocio, no necesita
      # exponerse más allá de la máquina.
      - "127.0.0.1:${PG_STORAGE_PORT:-5433}:5432"
    volumes:
      - pg_storage_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_STORAGE_USER:-powersync_storage} -d ${PG_STORAGE_DB:-powersync_storage}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pg_storage_data:

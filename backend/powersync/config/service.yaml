# yaml-language-server: $schema=https://unpkg.com/@powersync/service-schema@latest/json-schema/powersync-config.json
#
# Config del servicio PowerSync self-hosted. `!env NOMBRE` sustituye el valor
# de la variable de entorno NOMBRE (solo variables que empiecen con `PS_`
# pueden sustituirse así). Ver ../docker-compose.yml para de dónde vienen.

telemetry:
  disable_telemetry_sharing: true

# Base de datos de negocio (Railway) como fuente de replicación lógica.
# powersync_role es de solo lectura + replicación (ver
# ../sql/prepare-source-db.sql).
#
# sslmode: verify-ca — el proxy de Railway sirve un certificado autofirmado
# (CN=localhost, emitido por una CA propia CN=root-ca) que no valida contra
# las CAs de confianza del sistema, por eso verify-full/verify-ca fallaban
# antes con "certificate verify failed". La solución no es desactivar TLS:
# es fijar (pin) esa CA autofirmada explícitamente con `cacert` (PS_PG_CACERT
# en powersync/.env, ver .env.example) — el schema de PowerSync sí soporta
# esto aunque el certificado no sea de una CA pública. Con eso, verify-ca
# cifra el tráfico y valida que el servidor presente un cert firmado por esa
# CA pinneada (protege contra MITM en el internet público), sin necesitar
# red privada de Railway. No se usa verify-full porque el cert hoja dice
# CN=localhost, no el hostname público — verify-ca no valida el hostname,
# solo la cadena de confianza, así que es la opción correcta aquí. Detalle
# completo y cómo regenerar el cert si Railway lo rota: ver POWERSYNC.md.
replication:
  connections:
    - type: postgresql
      uri: !env PS_DATA_SOURCE_URI
      sslmode: verify-ca
      cacert: !env PS_PG_CACERT

# Almacenamiento interno de PowerSync (buckets de sincronización), en su
# propio Postgres (contenedor pg-storage), separado del esquema de negocio.
storage:
  type: postgresql
  uri: !env PS_STORAGE_SOURCE_URI
  sslmode: disable

port: !env PS_PORT

sync_config:
  path: sync-config.yaml

# Autenticación: PowerSync valida el MISMO JWT que ya emite el backend propio
# (mismo secreto HS256 que JWT_SECRET, ver ../../.env), en vez de tener un
# login/JWKS aparte. Ver ../POWERSYNC.md para el detalle de cómo se deriva
# PS_JWT_SECRET_B64URL.
client_auth:
  jwks:
    keys:
      - kty: oct
        alg: HS256
        kid: !env PS_JWT_KID
        k: !env PS_JWT_SECRET_B64URL
  audience: ["gi-control-combustible-powersync"]

api:
  tokens:
    # Token de administración de la API local de PowerSync (no confundir con
    # los JWT de usuario). Cámbialo si expones este servicio más allá de tu
    # máquina.
    - dev-only-cambiar-en-produccion

name: gi_control_combustible
description: "INDI Combustible — control de flota y cargas de combustible."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  data_table_2: ^2.7.2
  dio: ^5.10.0
  fl_chart: ^1.2.0
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.3.2
  flutter_secure_storage: ^10.3.1
  go_router: ^17.3.0
  google_fonts: ^8.1.0
  image_picker: ^1.2.3
  intl: ^0.20.3
  local_auth: ^2.3.0
  path: ^1.9.1
  path_provider: ^2.1.6
  powersync: ^2.3.1
  sentry_flutter: ^8.14.2
  shared_preferences: ^2.5.3
  uuid: ^4.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

# local_auth_windows real no compila con Visual Studio 2026 (usa <experimental/coroutine>,
# que ese compilador elimina). No usamos biometría en Windows (ver BiometriaService), así que
# lo reemplazamos por un stub sin proyecto nativo: ver packages/local_auth_windows_stub/.
dependency_overrides:
  local_auth_windows:
    path: packages/local_auth_windows_stub

flutter:
  uses-material-design: true
  assets:
    - assets/images/
